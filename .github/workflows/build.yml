
name: Build Geode Mod

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.config.name }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64

          - name: macOS
            os: macos-latest
            target: MacOS

          - name: iOS
            os: macos-latest
            target: iOS

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

          bindings: ${{ matrix.config.name == 'iOS' && 'vwtfafa/bindings' || 'geode-sdk/bindings' }}
          bindings-ref: ${{ matrix.config.name == 'iOS' && 'fix/2.2081-depends' || '' }}

  package:
    name: Combine platform builds
    runs-on: ubuntu-latest

    needs:
      - build

    # Run even if one or more platforms fail
    if: always()

    steps:
      - name: Combine Geode builds
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main

      - name: Upload combined mod
        uses: actions/upload-artifact@v7
        with:
          name: SpamBuffer-MultiPlatform
          path: ${{ steps.combine.outputs.build-output }}
          if-no-files-found: error
