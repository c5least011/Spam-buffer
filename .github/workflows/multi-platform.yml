name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest

          - name: macOS
            os: macos-latest

          - name: iOS
            os: macos-latest
            target: iOS

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}
          sdk: given
          cli: latest
          # iOS dùng bindings fork của bạn, các nền tảng khác dùng bindings gốc
          bindings: ${{ matrix.config.name == 'iOS' && 'c5least011/bindings' || 'geode-sdk/bindings' }}
          bindings-ref: ${{ matrix.config.name == 'iOS' && 'fix/2.2081-depends' || '' }}

  package:
    name: Combine platform builds
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Combine Geode builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload combined mod
        uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
